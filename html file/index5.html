<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Navbar</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background-color: white;
        }
        .para{
            background-color: rgba(72, 72, 104, 0.589);
            padding: 10px;
        }
        header{
            background-color: rgb(231, 218, 218);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 20px;
            font-size: 18px;
        }
        .nav-item{
            display: flex;
            justify-content: center;
            gap: 25px;
            list-style: none;
        }
    </style>
</head>
<body>
    <p class="para">1.Simple Navbar</p>
    <header>
        <div>LoGo</div>
        <nav>
            <ul class="nav-item">
                <li>Home</li>
                <li>About</li>
                <li>Service</li>
                <li>Contact</li>
            </ul>
        </nav>
    </header>
</body>
</html>
